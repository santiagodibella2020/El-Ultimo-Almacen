name: Compilar para Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el .exe y el .zip para Steam
        run: npm run dist:win

      - name: Leer la versión
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publicar la versión para descargar
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: El Último Almacén ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/*.exe
            dist/*.zip

      # Las copias guardadas en Actions ocupan el espacio gratis de la cuenta.
      # El juego ya queda en Releases, así que se borran todas las que haya.
      - name: Borrar copias viejas de Actions
        uses: actions/github-script@v8
        with:
          script: |
            const arts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100 });
            for (const a of arts) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner, repo: context.repo.repo, artifact_id: a.id });
            }
            core.info(`Borradas ${arts.length} copias`);
