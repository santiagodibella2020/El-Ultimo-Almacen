name: Compilar para Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el .exe y el .zip para Steam
        run: npm run dist:win

      - name: Guardar los archivos compilados
        uses: actions/upload-artifact@v4
        with:
          name: ElUltimoAlmacen-windows
          path: |
            dist/*.exe
            dist/*.zip

      - name: Publicar versión (solo con tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
